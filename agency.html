<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#4b5563;line-height:1.65;min-height:100vh;background-color:#6d28d9;background-image:radial-gradient(circle at 10% 4%,rgba(255,255,255,.10),rgba(255,255,255,0) 38%),radial-gradient(circle at 92% 8%,rgba(189,221,254,.14),rgba(189,221,254,0) 40%),radial-gradient(circle at 88% 92%,rgba(253,153,216,.24),rgba(253,153,216,0) 46%),linear-gradient(160deg,#6626cd,#8338ea 32%,#9c29c4 64%,#c2479b);background-size:auto,auto,auto,cover;background-repeat:no-repeat,no-repeat,no-repeat,no-repeat;background-attachment:fixed}
.nav{position:sticky;top:0;z-index:9;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);color:#fff;flex-wrap:wrap}
.nav b{font-size:17px;text-shadow:0 2px 8px rgba(59,7,100,.45)}
.nav a{color:#f5f0ff;text-decoration:none;font-size:13px;padding:6px 12px;border-radius:999px}
.nav a.on{background:#fff;color:#7c3aed;font-weight:700;box-shadow:0 6px 16px rgba(59,7,100,.3)}
.lang-select-wrap{margin-left:auto}
.lang-select{background:rgba(255,255,255,0.2);color:#fff;border:1px solid #ffffff40;padding:5px 8px;border-radius:8px}
select option{background:#ffffff !important;color:#000000 !important}
select option:hover{background:#f3f4f6 !important;color:#000000 !important}
select option:checked{background:#eef2ff !important;color:#000000 !important}
.wrap{max-width:1040px;margin:0 auto;padding:34px 20px 34px}
h2{color:#fff;font-size:20px;text-align:center;margin:30px 0 16px;text-shadow:0 2px 14px rgba(70,10,110,.55)}
h2:after{content:"";display:block;width:56px;height:3px;margin:10px auto 0;border-radius:4px;background:linear-gradient(to right,#f0abfc,#fff)}
.grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:stretch}
.grid>*{flex:1 1 140px;max-width:340px;min-width:0}
@media(min-width:640px){.grid>*{flex-basis:23%}}
@media(min-width:1024px){.grid>*{flex-basis:18.4%}}
.card{background:#fff;border:1px solid rgba(124,58,237,.12);border-radius:18px;padding:16px;box-shadow:0 18px 32px -22px rgba(59,7,100,.55);display:flex;flex-direction:column;gap:6px}
.card i{font-style:normal;font-size:22px}
.card p{font-size:13px}
.card b{color:#3b0764;font-size:14px}
.card u{margin-top:auto;text-decoration:none;background:linear-gradient(135deg,#f3e8ff,#fce7f3);color:#7c3aed;border:1px solid rgba(124,58,237,.22);border-radius:12px;padding:7px 10px;font-size:12px;font-weight:700;text-align:center}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.tags span{background:#f5f3ff;color:#7c3aed;border:1px solid rgba(124,58,237,.2);border-radius:999px;padding:3px 10px;font-size:11.5px}
.rate{text-align:center;background:#faf5ff;border:1px solid rgba(124,58,237,.22);border-radius:14px;padding:12px;color:#6d28d9;font-weight:700;margin-top:16px;font-size:13px}
.box{background:#fff;border:1px solid rgba(124,58,237,.12);border-radius:18px;padding:18px;box-shadow:0 18px 32px -22px rgba(59,7,100,.55);margin-top:14px}
.box h3{color:#3b0764;font-size:16px;padding-bottom:8px;border-bottom:2px solid #ede9fe;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:4px}
.box table{font-size:12.5px}
th{line-height:1.3}
th{background:#f5f3ff;color:#5b21b6;padding:9px;text-align:left;border-bottom:2px solid rgba(124,58,237,.25)}
td{padding:8px 9px;border-bottom:1px solid #ede9fe;color:#374151}
tr:last-child td{border-bottom:0}
.hi{background:#fdf2f8}
.hi td{color:#be185d;font-weight:700}
.note{color:#6b7280;font-size:12px;margin:8px 0 2px}
ul{padding-left:18px;font-size:13.5px}
li{margin-bottom:6px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:6px}
.flagbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;text-align:center}
.flagbox div{background:#faf5ff;border:1px solid rgba(124,58,237,.15);border-radius:14px;padding:10px 6px;font-size:12.5px;color:#4c1d95}
.flagbox b{display:block;color:#7c3aed;font-size:17px;margin:4px 0 2px}
.step{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;margin-bottom:10px}
.step em{font-style:normal;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#c026d3);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.warn{background:#fff;border:1px solid rgba(239,68,68,.32);border-radius:999px;color:#b91c1c;text-align:center;font-size:13px;padding:12px 16px;margin-top:18px;box-shadow:0 14px 30px -18px rgba(59,7,100,.45)}
.warn b{color:#dc2626}
.tagbox{text-align:center;margin-top:18px}
.tagbox span{display:inline-block;background:rgba(255,255,255,.9);color:#6d28d9;border-radius:999px;padding:8px 16px;font-size:12.5px;box-shadow:0 10px 22px -16px rgba(59,7,100,.6)}
footer{max-width:980px;margin:26px auto 34px;padding:0 20px}
footer a{
  position:relative;display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(135deg,#c026d3,#7c3aed,#4f46e5);background-size:200% 200%;
  color:#fff;text-decoration:none;font-weight:800;font-size:15px;padding:15px 18px;border-radius:999px;
  box-shadow:0 0 0 0 rgba(216,70,220,.75);
  animation: btnGlow 1.4s infinite ease-in-out, btnGradient 3s infinite ease;
  transition: transform .25s ease, box-shadow .25s ease;overflow:hidden;
}
footer a::before{
  content:"";position:absolute;inset:0;border-radius:999px;padding:2px;
  background:linear-gradient(120deg,#fff,#f0abfc,#c084fc,#fff);background-size:300% 300%;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation: borderMove 2.4s linear infinite;pointer-events:none;opacity:.85;
}
footer a .rocket{display:inline-block;animation: rocketJump .6s infinite ease-in-out;font-size:18px;filter: drop-shadow(0 0 6px rgba(255,255,255,.9))}
footer a:hover{transform:scale(1.06);box-shadow:0 10px 40px rgba(216,70,220,.85)}
footer a:hover .rocket{animation: rocketFly .4s infinite ease-in-out}
@keyframes btnGlow{0%{box-shadow:0 0 0 0 rgba(216,70,220,.75)}40%{box-shadow:0 0 0 14px rgba(216,70,220,0)}100%{box-shadow:0 0 0 0 rgba(216,70,220,0)}}
@keyframes btnGradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes borderMove{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes rocketJump{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-4px) rotate(10deg)}}
@keyframes rocketFly{0%,100%{transform:translateX(0) scale(1)}50%{transform:translateX(4px) scale(1.12)}}
@media(max-width:420px){.wrap{padding:18px 14px 28px}h2{font-size:18px}footer{padding:0 14px}footer a{font-size:14px;padding:14px 16px}.nav{gap:6px}}
/* RTL 阿拉伯语布局 */
body[dir="rtl"]{direction:rtl;text-align:right}
body[dir="rtl"] th{text-align:right}
body[dir="rtl"] ul{padding-left:0;padding-right:18px}
body[dir="rtl"] .step{grid-template-columns:1fr 28px}
body[dir="rtl"] .nav{flex-direction:row-reverse}

function applyRTL(langKey){
    if(langKey === "ar"){
        document.body.setAttribute("dir","rtl");
    }else{
        document.body.removeAttribute("dir");
    }
}

(function(){
    const savedLang = localStorage.getItem("emma_agency_lang");
    const defaultLang = savedLang || "en";

    document.getElementById("langSelect").value = defaultLang;
    render(defaultLang);
    applyRTL(defaultLang);

    document.getElementById("langSelect").addEventListener("change",function(){
        const val = this.value;
        localStorage.setItem("emma_agency_lang", val);
        render(val);
        applyRTL(val);
    });
})();
